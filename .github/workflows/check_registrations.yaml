name: Check Number of Registered Digimon

on:
  schedule:
    - cron: "30 16 1 * *"
      timezone: "America/New_York"

jobs:
  post-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scraper
    permissions:
      contents: read # access to check out code and install dependencies
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Verify registered Digimon matches reference

        run: python registrations.py
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}  # the base URL to request against

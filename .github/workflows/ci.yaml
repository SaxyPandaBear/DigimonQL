name: Golang CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        check-latest: true
    - name: Build
      run: go build -v ./...
    - name: Test
      run: go test ./... -cover -v -timeout 10s
